version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hafalan-tracker-db
    environment:
      POSTGRES_USER: hafalan_user
      POSTGRES_PASSWORD: hafalan_pass
      POSTGRES_DB: hafalan_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hafalan-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: hafalan-tracker-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hafalan_user
      DB_PASSWORD: hafalan_pass
      DB_NAME: hafalan_tracker
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hafalan-network
    volumes:
      - ../backend:/app
      - ../shared:/app/shared

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: hafalan-tracker-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hafalan-network
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  hafalan-network:
    driver: bridge
